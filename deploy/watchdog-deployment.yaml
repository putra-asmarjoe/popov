apiVersion: apps/v1
kind: Deployment
metadata:
  name: popov-watchdog
  namespace: default
  labels:
    app: popov-watchdog
    component: watchdog-worker
spec:
  # ⚠️ replicas MUST stay 1 — do NOT increase.
  # WatchdogScheduler polls observability targets + anti-spam fingerprinting.
  # More than 1 instance = N× duplicated polling, duplicate alerts, duplicate tickets.
  # Scale the popov-agent pod (web/API) instead, never this one. (SCALE_ESCALATION_PLAN.md L1)
  replicas: 1
  strategy:
    type: Recreate   # avoid two overlapping instances during rolling updates
  selector:
    matchLabels:
      app: popov-watchdog
  template:
    metadata:
      labels:
        app: popov-watchdog
        component: watchdog-worker
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: watchdog-worker
          image: <YOUR_DOCKERHUB_USERNAME>/popov-agent:latest
          imagePullPolicy: Always
          command: ["python", "watchdog_worker.py"]
          envFrom:
            - configMapRef:
                name: popov-agent-configmap
            - secretRef:
                name: popov-agent-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi