apiVersion: v1
kind: Secret
metadata:
  name: popov-agent-secret
  namespace: default
type: Opaque
stringData:
  # Telegram: Fix #39 kredensial bot MURNI DB (Workspace Settings → Notifications)
  # LLM API Keys (isi setidaknya satu sesuai provider yang dipilih di ConfigMap)
  OPENAI_API_KEY: "CHANGE_ME_YOUR_OPENAI_API_KEY"
  OPENROUTER_API_KEY: "CHANGE_ME_YOUR_OPENROUTER_API_KEY"
  GOOGLE_API_KEY: "CHANGE_ME_YOUR_GOOGLE_API_KEY"

  # Database Credentials & Connection String
  JWT_SECRET: "CHANGE_ME_GENERATE_A_LONG_RANDOM_STRING"
  JWT_EXPIRY_HOURS: "24"
  DATA_ENCRYPTION_KEY: "CHANGE_ME_32_BYTE_HEX_OR_PASSPHRASE"
  MONGODB_URI: "mongodb://mongodb-service:27017"
  MYSQL_PASSWORD: "CHANGE_ME_YOUR_MYSQL_PASSWORD"
