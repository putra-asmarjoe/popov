apiVersion: apps/v1
kind: Deployment
metadata:
  name: popov-agent
  namespace: default
  labels:
    app: popov-agent
spec:
  # Note: keep replicas: 1 — Telegram long-polling (getUpdates) requires a single instance.
  #       The watchdog already runs as a separate process (deploy/watchdog-deployment.yaml, replicas: 1 REQUIRED).
  replicas: 1
  selector:
    matchLabels:
      app: popov-agent
  template:
    metadata:
      labels:
        app: popov-agent
    spec:
      # Kubernetes secret for Private Docker Hub registry auth
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: popov-agent
          # Replace <YOUR_DOCKERHUB_USERNAME> with your Docker Hub username
          image: <YOUR_DOCKERHUB_USERNAME>/popov-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: popov-agent-configmap
            - secretRef:
                name: popov-agent-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # Pattern Miner outputs (learned_playbooks/ + patterns/) — survive
            # container/pod restarts. Data is derived (from incident_episodes,
            # regenerable by the miner) → emptyDir is enough; for cross-node
            # persistence switch to a PVC (see the note in the volumes section).
            - name: pattern-miner-data
              mountPath: /app/learned_playbooks
              subPath: learned_playbooks
            - name: pattern-miner-data
              mountPath: /app/patterns
              subPath: patterns
      volumes:
        # emptyDir: lives as long as the POD lives (container restart = safe,
        # node reschedule = wiped — the miner regenerates automatically).
        # Need full persistence? Switch to a PVC:
        #   persistentVolumeClaim:
        #     claimName: popov-pattern-data
        - name: pattern-miner-data
          emptyDir: {}
