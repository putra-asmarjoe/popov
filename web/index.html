<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Brand favicon set (samplelogo/faviicon) -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png" />

    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="theme-color" content="#2b7fc2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ⚠️ ANTI-FOUC: harus paling atas, jalan sebelum React mount.
         Pakai var + ES5 untuk eksekusi universal. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('popov-agent-theme');
          var VALID = ['light', 'dark', 'fancy', 'calm', 'system'];
          var t = VALID.indexOf(s) !== -1 ? s : 'light';
          if (t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = (t === 'light') ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>

    <title>Popov — Incident Response Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
